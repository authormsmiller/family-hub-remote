<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Calendar</title>
  <!-- Fast, robust iCal parser bundle from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
    }
    h1 { font-size: 1.8rem; font-weight: 600; letter-spacing: -0.5px; }
    #clock { font-size: 1.8rem; font-weight: 400; color: #58a6ff; font-variant-numeric: tabular-nums; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(5, 1fr);
      gap: 6px;
      flex-grow: 1;
      height: 100%;
    }
    .day-header {
      text-align: center;
      font-weight: 600;
      color: #8b949e;
      padding: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cell {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .cell.inactive { opacity: 0.25; background: #0b0e14; }
    .cell.today { border: 2px solid #58a6ff; background: #1c2128; }
    .date-num { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #8b949e; }
    .cell.today .date-num { color: #58a6ff; }
    .events-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .events-container::-webkit-scrollbar { display: none; }
    .event {
      background: #1f6feb;
      color: #ffffff;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .event .time {
      color: #bbdefb;
      font-size: 0.7rem;
      font-weight: 500;
    }
    #error-notice {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #21262d;
      border: 1px solid #f85149;
      padding: 24px;
      border-radius: 10px;
      text-align: center;
      max-width: 500px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="month-name">Loading Calendar...</h1>
    <div id="clock">00:00</div>
  </header>

  <div class="calendar-grid" id="grid">
    <div class="day-header">Sun</div>
    <div class="day-header">Mon</div>
    <div class="day-header">Tue</div>
    <div class="day-header">Wed</div>
    <div class="day-header">Thu</div>
    <div class="day-header">Fri</div>
    <div class="day-header">Sat</div>
  </div>

  <div id="error-notice">
    <h3 style="color: #f85149; margin-bottom: 8px;">Missing Private iCal Address</h3>
    <p style="font-size: 0.9rem; color: #c9d1d9;">
      Append your secret Google Calendar link to this URL following a <code>#</code> symbol:
    </p>
    <code style="display: block; margin-top: 10px; padding: 8px; background: #0d1117; font-size: 0.75rem; word-break: break-all; color: #58a6ff;">
      ...index.html#https://calendar.google.com/calendar/ical/.../basic.ics
    </code>
  </div>

  <script>
    // Live Clock display
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Pull calendar link entirely from the local hash fragment (after '#')
    const rawHash = window.location.hash.substring(1);
    const SECRET_ICAL_URL = decodeURIComponent(rawHash).trim();

    async function loadCalendar() {
      const errorBox = document.getElementById('error-notice');

      if (!SECRET_ICAL_URL || !SECRET_ICAL_URL.startsWith("http")) {
        errorBox.style.display = 'block';
        document.getElementById('month-name').innerText = "Display Ready";
        renderMonth([]);
        return;
      }

      try {
        // Free CORS proxy to avoid cross-domain browser blocks on client fetch
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(SECRET_ICAL_URL);
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error("Network request failed: " + res.status);
        const icsText = await res.text();

        // Parse via ical.js
        const jcalData = ICAL.parse(icsText);
        const comp = new ICAL.Component(jcalData);
        const vevents = comp.getAllSubcomponents('vevent');

        const events = vevents.map(v => {
          const item = new ICAL.Event(v);
          const start = item.startDate.toJSDate();
          return {
            title: item.summary || "Untitled Event",
            start: start,
            isAllDay: item.startDate.isDate
          };
        });

        renderMonth(events);
      } catch (err) {
        console.error("Calendar Load Failure:", err);
        document.getElementById('month-name').innerText = "Sync Failed (Retrying...)";
      }
    }

    function renderMonth(events) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      document.getElementById('month-name').innerText = now.toLocaleString('default', { month: 'long', year: 'numeric' });

      const firstDayIdx = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('grid');
      // Keep first 7 day-header items, clear out previous day cells
      while (grid.children.length > 7) {
        grid.removeChild(grid.lastChild);
      }

      // Empty offset cells for days before the 1st of the month
      for (let i = 0; i < firstDayIdx; i++) {
        const blank = document.createElement('div');
        blank.className = 'cell inactive';
        grid.appendChild(blank);
      }

      // Render actual days
      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (d === now.getDate()) cell.classList.add('today');

        const dateNum = document.createElement('div');
        dateNum.className = 'date-num';
        dateNum.innerText = d;
        cell.appendChild(dateNum);

        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'events-container';

        // Filter events belonging to this calendar date
        const dayEvents = events.filter(e => {
          return e.start.getDate() === d &&
                 e.start.getMonth() === month &&
                 e.start.getFullYear() === year;
        });

        // Sort events chronologically
        dayEvents.sort((a, b) => a.start - b.start);

        dayEvents.forEach(ev => {
          const el = document.createElement('div');
          el.className = 'event';
          
          if (!ev.isAllDay) {
            const timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.innerText = ev.start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(' ', '');
            el.appendChild(timeSpan);
          }

          const titleSpan = document.createElement('span');
          titleSpan.innerText = ev.title;
          el.appendChild(titleSpan);

          eventsContainer.appendChild(el);
        });

        cell.appendChild(eventsContainer);
        grid.appendChild(cell);
      }
    }

    loadCalendar();
    // Auto-sync calendar events every 15 minutes
    setInterval(loadCalendar, 15 * 60 * 1000);
  </script>
</body>
</html>
